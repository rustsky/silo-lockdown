<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Silo: Lockdown</title>
  <style>
    html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #08080a; touch-action: none; }
    canvas:focus { outline: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- miniquad's JS loader, vendored from the exact miniquad version we build against
       (crates/silo_gfx/web/gl.js, from miniquad 0.4.11) so the page works offline. -->
  <script src="gl.js"></script>
  <script>load("silo_gfx.wasm");</script>
</body>
</html>
