<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Silo: Lockdown</title>
  <!-- Installable web app: Add to Home Screen runs it full-screen and offline. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Silo">
  <meta name="theme-color" content="#08080a">
  <style>
    html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #08080a; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas:focus { outline: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- miniquad's and quad-snd's JS loaders, vendored from the exact versions we build
       against (miniquad 0.4.11, quad-snd 0.2.8), plus our iOS audio unlock and the live player count. -->
  <script src="gl.js"></script>
  <script src="audio.js"></script>
  <script src="audio-unlock.js"></script>
  <script src="stats.js"></script>
  <script>
    load("silo_gfx.wasm");
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      // A new version finished downloading in the background and took over. If the game only
      // just opened, restart into it now; otherwise it starts the next time the game is opened.
      var hadCopy = !!navigator.serviceWorker.controller, opened = Date.now();
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (hadCopy && Date.now() - opened < 30000) location.reload();
      });
      // updateViaCache "none": the version check always asks the server, never a cached sw.js.
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {});
    }
  </script>
</body>
</html>
